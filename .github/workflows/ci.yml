name: Test

on:
  # Every pull request, not only the ones targeting master, so a branch stacked
  # on another branch is still tested.
  pull_request:
  push:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both sides of the Temporal polyfill: 22 is the engine floor and has no
        # Temporal of its own, so it runs the polyfill's implementation, while 26
        # ships Temporal as a global and the polyfill defers to it. A date bug
        # that only appears on one of them is otherwise invisible here.
        version: ['22', '26']
      fail-fast: false
    steps:
      # Deep, because the baseline guard diffs against the branch point and a
      # three dot diff needs a merge base. A shallow checkout has none, which is
      # why this check silently passed for as long as it existed: the diff
      # failed, `|| true` swallowed it, and an empty result read as nothing
      # changed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A baseline records current behaviour, so changing one is normal - but it
      # has to be a decision. Without this a golden can be regenerated and
      # committed without anybody reading the diff, which is the only thing that
      # makes it worth committing as text. The rule itself is in the script, and
      # has its own tests.
      - name: Baseline changes are explained
        run: node scripts/check-baselines.mjs "${{ github.event.pull_request.base.sha }}"

      # The feed workflow holds DTD credentials. pull_request_target runs with
      # the base repository's secrets against a fork's code, which is how a
      # pull request gets to print them. Nothing here should ever use it.
      - name: No workflow runs a fork's code with our secrets
        run: |
          ! grep -rn "^\s*pull_request_target:" .github/workflows/

      - name: No conflict markers
        run: |
          ! git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!*.spec.ts'
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.version }}
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      # tsc -b walks the project references in dependency order, so a type error
      # is reported against the package that contains it.
      - run: yarn build
      # The build excludes the specs so they do not reach dist, which also means
      # nothing type checks them. This does.
      - run: yarn typecheck
      # Each workspace is a vitest project named after its package, so a failure
      # names the package rather than the repository.
      - run: yarn vitest run
      # Both CLIs have to work from the repository root as well as from their
      # own directory: tsx takes its compiler options from the nearest tsconfig
      # whose include matches the file.
      - run: yarn tsx apps/dtd2mysql/src/index.ts --help
      - run: yarn tsx apps/cif2gtfs/src/index.ts --help
      - run: yarn tsx apps/transxchange2gtfs/src/index.ts --help
      - run: yarn tsx apps/gtfsmerge/src/index.ts --help
      - run: yarn tsx apps/transfer-patterns/src/index.ts --help

  # Nothing above unit tests could run without a database, so every claim about
  # the importer has been checked by hand. This is where that stops.
  #
  # Once per database. The import and the GTFS build both run against all three,
  # and the recorded rows are the same file for each: a database needing its own
  # expectations is a bug rather than something to record. Both service
  # containers start for every leg, which costs a few seconds on the sqlite one
  # and keeps the matrix to the environment rather than the services.
  databases:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dialect: mysql
            port: 3306
            username: root
            password: ""
            name: dtd2mysql_test
          - dialect: postgres
            port: 5432
            username: postgres
            password: postgres
            name: dtd2mysql_test
          - dialect: sqlite
            port: 0
            username: ""
            password: ""
            name: /tmp/dtd2mysql_test.sqlite
      fail-fast: false
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: dtd2mysql_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtd2mysql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_DIALECT: ${{ matrix.dialect }}
      DATABASE_HOSTNAME: 127.0.0.1
      DATABASE_PORT: ${{ matrix.port }}
      DATABASE_USERNAME: ${{ matrix.username }}
      DATABASE_PASSWORD: ${{ matrix.password }}
      DATABASE_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build
      # Every row of every table the four feeds write to, against the same
      # recorded expectations whichever database answered.
      - run: yarn vitest run --config vitest.integration.config.mts
      # The importer against a real database: the whole parse-and-insert path, the
      # same feed from either source, and a second import landing the same rows.
      - name: The importer round trips
        run: node scripts/check-database.mjs "$RUNNER_TEMP/database"

  # A matrix job only ever reports under its leg names, and master requires a
  # check called database. This is that check: one name, green only when all
  # three legs are.
  database:
    runs-on: ubuntu-latest
    needs: databases
    if: always()
    steps:
      - name: Every database passed
        run: |
          echo "databases: ${{ needs.databases.result }}"
          [ "${{ needs.databases.result }}" = "success" ]

  # Every feed this repository builds is held to the MobilityData validator.
  # Separate from unit because it needs a JVM and a 40 MB jar, and because a
  # validator release adding a notice should not read as the tests breaking.
  validate:
    runs-on: ubuntu-latest
    env:
      VALIDATOR_VERSION: 8.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # Pinned rather than latest, so the accepted notice list only moves when
      # somebody moves it.
      - uses: actions/cache@v4
        id: validator
        with:
          path: gtfs-validator.jar
          key: gtfs-validator-${{ env.VALIDATOR_VERSION }}
      - if: steps.validator.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o gtfs-validator.jar \
            "https://github.com/MobilityData/gtfs-validator/releases/download/v$VALIDATOR_VERSION/gtfs-validator-$VALIDATOR_VERSION-cli.jar"
      - run: yarn install --immutable
      - run: yarn build
      # All three feeds: the rail one, the bus one, and the merge of them. The
      # merged feed is the one worth having here - the merge renumbers every
      # service, route and trip id across two feeds, and a dangling reference
      # from that is what a hand-written fixture cannot produce.
      - run: node tests/dist/validate.mjs gtfs-validator.jar

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build
      # Tests run against source, so main, types, bin, exports and files breakage
      # is invisible to them: a package can pass every spec and still ship a
      # tarball that cannot be required. This packs every workspace, installs
      # each published thing on its own, and does something real with it. It
      # runs locally too, which is the point of it not being written in YAML.
      - name: The packaged tarballs work
        run: node scripts/check-packaged.mjs "$RUNNER_TEMP/packaged"
