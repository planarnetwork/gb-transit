name: Nightly feed

# Never on a pull request, and never pull_request_target. The DTD credentials
# are what makes that rule matter: a workflow that a fork can trigger is a
# workflow that can be made to print them.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      range:
        description: How far ahead to build
        default: 3 months
      publish:
        description: Attach the result to a release
        type: boolean
        default: true

concurrency:
  group: nightly-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Two builds and two validator runs, 45 minutes each.
    timeout-minutes: 90
    # The tag the patterns are attached to, so the jobs below add to the release
    # this run made rather than looking up the newest one and racing a rerun.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    # The secrets are named for the feed, the variables for the protocol it
    # arrives over: dtd2mysql reads SFTP_*, so the names cannot be made to
    # match on either side and the mapping belongs here.
    env:
      SFTP_HOSTNAME: ${{ secrets.DTD_HOSTNAME }}
      SFTP_USERNAME: ${{ secrets.DTD_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.DTD_PASSWORD }}
      GTFS_RANGE: ${{ inputs.range || '3 months' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Fail fast without credentials
        run: |
          # DTD_HOSTNAME is not required: dtd2mysql defaults it to
          # dtd.atocrsp.org when it is empty.
          if [ -z "$SFTP_USERNAME" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "The DTD_USERNAME and DTD_PASSWORD secrets are not set for this repository."
            echo "They come from a Rail Data Marketplace subscription - raildata.org.uk."
            exit 1
          fi

      - run: yarn install --immutable
      - run: yarn build

      # There is no stored cursor: with no database to import into, the download
      # takes the most recent full refresh and the incrementals after it every
      # time, so there is no state to get out of step with reality.
      #
      # The cache therefore saves nothing today - the download overwrites what
      # it restores. It is here because the alternative to a cursor is deriving
      # the set to fetch from what is already on disk, and that needs the disk
      # to persist. Until a cursor reads this directory, it is carrying a cost
      # for a later benefit.
      - uses: actions/cache@v4
        with:
          path: data/feeds
          key: dtd-feeds-${{ github.run_id }}
          restore-keys: dtd-feeds-

      - name: Download the timetable
        run: |
          mkdir -p data/feeds
          yarn tsx apps/dtd2mysql/src/index.ts --download-timetable data/feeds/
          ls -la data/feeds/

      # The station groups extension reads the fares refresh for its group
      # membership. A failure here fails the build rather than quietly
      # publishing a feed without areas.txt: a file that silently comes and goes
      # is worse than one that is never there.
      - name: Download the fares feed
        run: |
          yarn tsx apps/dtd2mysql/src/index.ts --download-fares data/feeds/
          ls -la data/feeds/

      - name: Build the feed
        run: |
          mkdir -p feed
          yarn tsx apps/cif2gtfs/src/index.ts build --config gtfs.config.yaml --out feed | tee build.log

      # The same timetable without the services National Rail does not hold
      # authority over - the tube, the Metro, the ferries, the buses and the
      # replacement buses TfL runs. A feed combined with other sources has
      # better answers for those elsewhere, and a feed read on its own wants
      # them, so both are published.
      #
      # A second config rather than a flag: what a published feed contains
      # should arrive as a diff somebody approved.
      # No --out: the config carries it, so where this feed is written is a line
      # in a reviewed file rather than a flag here, and the spec holding the two
      # configs to different destinations is what stops the nightly building
      # over itself.
      - name: Build the National Rail only feed
        run: |
          yarn tsx apps/cif2gtfs/src/index.ts build --config gtfs.national-rail-only.config.yaml \
            | tee build-national-rail-only.log

      # A published feed that fails referential integrity must never reach a
      # release, so the validator runs before anything is attached. What counts
      # as a failure is a baseline file: an unlisted error, or more of a listed
      # one than it accepts. One baseline each, because accepting in one feed what
      # only the other raises would not be a gate. Either failing stops the
      # release: a half-published set is worse than a late one.
      - name: Validate
        run: |
          curl -sSfL -o gtfs-validator.jar \
            "https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar"

          java -jar gtfs-validator.jar -i feed -o report -svu
          node scripts/check-validation.mjs \
            report/report.json .github/validator-baseline.json feed/validation.json

          java -jar gtfs-validator.jar -i feed-national-rail-only -o report-national-rail-only -svu
          node scripts/check-validation.mjs \
            report-national-rail-only/report.json \
            .github/validator-baseline-national-rail-only.json \
            feed-national-rail-only/validation.json

      # A feed that suddenly has a fifth fewer trips than yesterday is a feed
      # with something wrong in it, and it is cheaper to stop than to withdraw.
      # The limit is a sixth rather than something tighter because a timetable
      # change moves the count on its own. The window reaches three months
      # ahead, so it ends past the last day the current timetable covers, and
      # the day the new one loads those days go from empty to a full service in
      # a single build.
      # There is no previous release on the first run, so there is nothing to
      # compare against and nothing to complain about.
      - name: Compare with the last release
        id: compare
        run: |
          trips=$(( $(wc -l < feed/trips.txt) - 1 ))

          # A feed whose trips point at no shape is a feed that built shapes.txt
          # and then failed to reference it - valid GTFS, and useless.
          undrawn=$(awk -F, 'NR > 1 && $NF == ""' feed/trips.txt | wc -l)
          echo "Trips with no shape: $undrawn"

          if [ "$undrawn" -gt "$(( trips / 100 ))" ]; then
            echo "More than 1% of trips have no shape, so something has stopped placing stations."
            exit 1
          fi

          # A shape is drawn through every station the train touches, the ones it
          # runs through as well as the ones it calls at. A source that stopped
          # handing over the passing rows would still build a valid feed, with
          # every line drawn from call to call, and the checks above would pass
          # it: the trips and the calls are the same either way. A line through
          # the calls alone never has more points than the trip has calls, and
          # one through the passes as well does for 41% of trips, so fewer than a
          # tenth is the passing rows missing rather than a timetable changing.
          # Not a count against the last release: the lines through the calls
          # alone come to only 15% fewer points, because they share less.
          through=$(awk -F, '
            FILENAME == "feed/shapes.txt" && FNR > 1 { points[$1]++ }
            FILENAME == "feed/trips.txt" && FNR > 1 { shape[$3] = $NF }
            FILENAME == "feed/stop_times.txt" && FNR > 1 { calls[$1]++ }
            END { for (trip in calls) if (shape[trip] != "" && points[shape[trip]] > calls[trip]) n++; print n + 0 }
          ' feed/shapes.txt feed/trips.txt feed/stop_times.txt)
          echo "Trips drawn through somewhere they do not call: $through"

          if [ "$through" -lt "$(( trips / 10 ))" ]; then
            echo "Fewer than a tenth of trips are drawn through anywhere they do not call, so the"
            echo "passing points are not reaching the shapes."
            exit 1
          fi

          echo "trips=$trips" >> "$GITHUB_OUTPUT"
          echo "This build: $trips trips"

          # Meant to have fewer, so it is not held to the same count - but it has
          # to have fewer. A rename, a parse regression or a changed ATOC code
          # would make the exclusions a no-op, and a second zip identical to the
          # first would otherwise pass every gate here.
          national_rail_only=$(( $(wc -l < feed-national-rail-only/trips.txt) - 1 ))
          echo "national_rail_only_trips=$national_rail_only" >> "$GITHUB_OUTPUT"
          echo "National Rail only: $national_rail_only trips"

          if [ "$national_rail_only" -ge "$trips" ]; then
            echo "The National Rail only feed excluded nothing, so the exclusions are not working."
            exit 1
          fi

          previous=$(gh release list --limit 20 --json tagName \
            --jq '[.[] | select(.tagName | startswith("feed-"))][0].tagName' || true)

          if [ -z "$previous" ]; then
            echo "No previous feed release to compare against."
            exit 0
          fi

          gh release download "$previous" --pattern feed-meta.json --output previous.json || exit 0
          was=$(node -p "require('./previous.json').trips")
          echo "Previous ($previous): $was trips"

          limit=15

          node -e "
            const was = $was, now = $trips;
            const swing = Math.abs(now - was) / was * 100;
            console.log('Swing: ' + swing.toFixed(1) + '%');
            if (swing > $limit) {
              console.error('More than $limit% different from the last release. Releasing this needs a human.');
              process.exit(1);
            }
          "

          # The same check on the National Rail only feed, which catches the opposite failure
          # to the one above: a rule that suddenly matches far more than it did
          # yesterday. Skipped against a release published before the field
          # existed, which carries no count to compare with.
          node -e "
            const previous = require('./previous.json').trips_national_rail_only;
            const now = $national_rail_only;
            if (previous === undefined) {
              console.log('The last release predates the National Rail only feed.');
              process.exit(0);
            }
            const swing = Math.abs(now - previous) / previous * 100;
            console.log('National Rail only: ' + previous + ' -> ' + now + ', swing ' + swing.toFixed(1) + '%');
            if (swing > $limit) {
              console.error('The National Rail only feed moved more than $limit%. Releasing this needs a human.');
              process.exit(1);
            }
          "
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Describe the build
        run: |
          node -e "
            const fs = require('fs');
            const info = fs.readFileSync('feed/feed_info.txt', 'utf8').trim().split('\n');
            const [names, values] = info.map(line => line.split(','));
            const feed = Object.fromEntries(names.map((n, i) => [n, values[i]]));
            // The sources and what they did come from the build rather than
            // from here, so the page describing the feed cannot claim a source
            // the feed was not built from. Absent when nothing was enriched.
            const report = fs.existsSync('feed/enrichment-report.json')
              ? JSON.parse(fs.readFileSync('feed/enrichment-report.json', 'utf8'))
              : {sources: [], enrichers: [], extensions: []};
            // Counted rather than described, so the release says what the
            // zips actually hold rather than what they were meant to.
            const rows = file => fs.readFileSync(file, 'utf8').trimEnd().split('\n').length - 1;
            fs.writeFileSync('feed/feed-meta.json', JSON.stringify({
              built: new Date().toISOString(),
              commit: '${{ github.sha }}',
              trips: ${{ steps.compare.outputs.trips }},
              trips_national_rail_only: ${{ steps.compare.outputs.national_rail_only_trips }},
              stop_times: rows('feed/stop_times.txt'),
              stop_times_national_rail_only: rows('feed-national-rail-only/stop_times.txt'),
              shape_points: rows('feed/shapes.txt'),
              shapes: new Set(
                fs.readFileSync('feed/shapes.txt', 'utf8').trimEnd().split('\n').slice(1)
                  .map(line => line.slice(0, line.indexOf(',')))
              ).size,
              feed_version: feed.feed_version,
              feed_start_date: feed.feed_start_date,
              feed_end_date: feed.feed_end_date,
              sources: report.sources,
              enrichers: report.enrichers,
              extensions: report.extensions
            }, null, 2));
          "
          cat feed/feed-meta.json

      - name: Package
        run: |
          cd feed && zip -q -r ../gtfs.zip . -x validation.json feed-meta.json enrichment-report.json provenance.json && cd ..
          cd feed-national-rail-only && zip -q -r ../gtfs-national-rail-only.zip . \
            -x validation.json feed-meta.json enrichment-report.json provenance.json && cd ..
          # A release asset is named by its basename, so the second feed's report
          # cannot go up as validation.json alongside the first's.
          cp feed-national-rail-only/validation.json validation-national-rail-only.json
          ls -la gtfs.zip gtfs-national-rail-only.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed
          path: |
            gtfs.zip
            gtfs-national-rail-only.zip
            feed/validation.json
            feed/feed-meta.json
            feed/enrichment-report.json
            feed/provenance.json
            feed-national-rail-only/validation.json
            build.log
            build-national-rail-only.log
          retention-days: 14

      # The tag is the date, so the release list reads as a history of feeds and
      # stays distinguishable from the v6.6.x version tags npm publishes under.
      - name: Release
        id: release
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          tag="feed-$(date -u +%Y-%m-%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --title "Feed $(date -u +%Y-%m-%d)" \
            --notes "$(node -p "
              const m = require('./feed/feed-meta.json');
              [
                '| | |', '|---|---|',
                '| Covers | ' + m.feed_start_date + ' to ' + m.feed_end_date + ' |',
                '| Trips | ' + m.trips.toLocaleString() + ' |',
                '| Source | ' + m.feed_version + ' |',
                '| Built from | ' + m.commit.slice(0, 7) + ' |',
                '',
                'Two feeds. A shape is drawn through every timing point a train touches, ' +
                  'including the ones it runs through without stopping. The line between two ' +
                  'stations is straight, because the DTD gives no coordinate for the junctions ' +
                  'between them.',
                '',
                '- \`gtfs.zip\` - where a service calls, and the line it runs over. ' +
                  m.trips.toLocaleString() + ' trips, ' +
                  m.stop_times.toLocaleString() + ' stop times, ' +
                  m.shapes.toLocaleString() + ' shapes.',
                '- \`gtfs-national-rail-only.zip\` - the first feed without the services National ' +
                  'Rail does not hold authority over: the tube, the Metro, the ferries, the ' +
                  'buses and the replacement buses TfL runs. ' +
                  m.trips_national_rail_only.toLocaleString() + ' trips, ' +
                  m.stop_times_national_rail_only.toLocaleString() + ' stop times.',
                '',
                // Written before the scan has run, so it says what is coming
                // rather than what arrived.
                '\`transfer-patterns.br\` is attached separately, once the scan that builds it ' +
                  'finishes. It holds the routes through the network that a transfer pattern ' +
                  'journey planner reads, and belongs with \`gtfs.zip\` above.'
              ].join('\n')
            ")" \
            gtfs.zip gtfs-national-rail-only.zip \
            feed/validation.json validation-national-rail-only.json \
            feed/feed-meta.json feed/enrichment-report.json \
            $([ -f feed/provenance.json ] && echo feed/provenance.json)
        env:
          GH_TOKEN: ${{ github.token }}

      # A release a day, each carrying two zips of 20 MB and up, accumulates
      # forever. The last month is what anybody fetches; past that what is
      # wanted is the
      # ability to say what the feed looked like in April, and one release a
      # month answers that as well as thirty do.
      #
      # Runs after the release, so a night that fails to publish prunes nothing.
      - name: Prune old feeds
        if: github.event_name == 'schedule' || inputs.publish
        run: node scripts/prune-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # The transfer patterns a journey planner reads, built from the feed above.
  #
  # Deliberately after the release rather than before it. Scanning the whole
  # network is the longest thing this repository does, and a feed nobody can
  # download because the patterns were slow is a worse outcome than a release
  # that is missing one file until tomorrow. Nothing here can reach the
  # zips: they are published by the time this starts.
  #
  # Sharded because a runner has four cores and the scan has a few hundred
  # core-seconds of work per day planned. Six jobs of four workers get through
  # it in the time one job of four would take on a sixth of it, and each stays
  # far enough inside its timeout to survive a slow night.
  # Not guarded on publish, unlike the release steps above: a dispatch with
  # publish off is the way to try a change to this without attaching anything,
  # and a job that only ever runs when it is also publishing is one that gets
  # tested for the first time on a night that matters. Nothing is uploaded to a
  # release unless there is a release to upload it to - see the last step.
  patterns:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the job that attaches to a release needs the write the workflow
    # grants.
    permissions:
      contents: read
    strategy:
      # One shard failing means the merge cannot be complete, so there is
      # nothing to be gained by letting the rest run on.
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build

      - uses: actions/download-artifact@v4
        with:
          name: feed

      # Four workers rather than the default of two fewer than the cores: that
      # leaves headroom for everything else a desktop is doing, and a runner is
      # doing nothing else. The main thread only hands out stations.
      - name: Plan
        run: |
          yarn tsx apps/transfer-patterns/src/index.ts plan gtfs.zip \
            --shard ${{ matrix.shard }}/6 \
            --workers 4 \
            --out shard-${{ matrix.shard }}.br

      # A day, not fourteen. These are read once by the job below and are worth
      # nothing afterwards. The .json beside each shard is how the merge tells
      # six shards of one run from six shards of two.
      - uses: actions/upload-artifact@v4
        with:
          name: patterns-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.br
            shard-${{ matrix.shard }}.br.json
          retention-days: 1

  # The one stage that cannot be split up: every pattern goes through it. It is
  # a streaming merge of sorted shards rather than a sort, so it holds one
  # pattern per shard and runs in the time it takes to read them.
  patterns-merge:
    needs: [build, patterns]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build

      - uses: actions/download-artifact@v4
        with:
          pattern: patterns-*
          merge-multiple: true

      # The merge writes the meta file: it is the only thing that knows how many
      # patterns there are without reading 34 million of them back, and
      # feed-meta.json is written by the build job before any of this happened
      # and so cannot honestly describe it.
      #
      # --shards 6 rather than trusting the glob: a merge of five is sorted,
      # well formed, readable and quietly missing a sixth of the network.
      - name: Merge
        run: |
          yarn tsx apps/transfer-patterns/src/index.ts merge shard-*.br \
            --shards 6 \
            --out transfer-patterns.br \
            --meta transfer-patterns-meta.json
          cat transfer-patterns-meta.json
          ls -la transfer-patterns.br

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-patterns
          path: |
            transfer-patterns.br
            transfer-patterns-meta.json
          retention-days: 14

      # --clobber so a rerun replaces the asset rather than failing on it. The
      # tag is empty when the build did not publish, which is the dispatch that
      # only wanted to see whether this works.
      - name: Attach to the release
        if: needs.build.outputs.tag != ''
        run: |
          gh release upload "${{ needs.build.outputs.tag }}" \
            transfer-patterns.br transfer-patterns-meta.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Everything the site would otherwise derive for itself, done once here.
  #
  # The site rebuilds whenever anything under apps/website changes, and deriving
  # the gzip and splitting twice took it 34 minutes - so a typo on a page cost
  # half an hour of recompressing patterns nobody had touched. Done here it is
  # paid once a night, and the site copies and unpacks.
  #
  # A job of its own rather than more of the merge: that one already spends 30
  # of its 45 minutes, and packaging failing should not cost the merge that
  # produced what is being packaged.
  patterns-package:
    needs: [build, patterns-merge]
    runs-on: ubuntu-latest
    # Twelve minutes of this on a fast machine, and the one measurement there is
    # of the same shape of work - the merge - ran 5.7 times slower on a runner
    # than it did here. So an hour or so, and this is the room that leaves.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build

      - uses: actions/download-artifact@v4
        with:
          name: transfer-patterns

      # Brotli is a third smaller and gzip is what a browser can decompress, so
      # which is wanted depends on who is reading. Both, of the whole file and of
      # every station.
      - name: Compress the other way, and split both
        run: |
          patterns=apps/transfer-patterns/src/index.ts

          yarn tsx $patterns merge transfer-patterns.br --out transfer-patterns.gz

          for extension in .gz .br; do
            yarn tsx $patterns split transfer-patterns.br \
              --out stations --extension $extension
          done

          ls stations | wc -l

      # tar rather than a zip, and no compression: every file in here is already
      # compressed, so squeezing the archive costs minutes and saves nothing. A
      # release takes 1000 assets and the network has more stations than that,
      # which is what these are for.
      - name: Archive the stations
        run: |
          # Named from a list rather than a glob: 2,812 of each would be 2,812
          # arguments, and flat inside the archive so unpacking it gives the
          # directory the site serves rather than a path to walk into.
          for extension in gz br; do
            (cd stations && find . -name "*.$extension" -printf '%P\0' | sort -z \
              | tar --null -cf "../station-patterns-$extension.tar" -T -)
          done

          ls -la station-patterns-gz.tar station-patterns-br.tar
          tar -tf station-patterns-gz.tar | wc -l
          tar -tf station-patterns-br.tar | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-patterns-packaged
          path: |
            transfer-patterns.gz
            station-patterns-gz.tar
            station-patterns-br.tar
          retention-days: 14

      - name: Attach to the release
        if: needs.build.outputs.tag != ''
        run: |
          gh release upload "${{ needs.build.outputs.tag }}" \
            transfer-patterns.gz station-patterns-gz.tar station-patterns-br.tar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
