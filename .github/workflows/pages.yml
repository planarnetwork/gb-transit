name: Website

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/website/**'
      - '.github/workflows/pages.yml'
  # The site reports the current feed, so it is rebuilt after one is published
  # rather than only when its own source changes.
  workflow_run:
    workflows: ["Nightly feed"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable

      # Before the build, because everything in `public/` is copied into the
      # site as it stands.
      #
      # The feed, and what the nightly publishes about it. The explorer reads
      # all of them from this origin, the way it reads the feed - so what the
      # validator made of the build, and what each source wrote and overruled,
      # are things a reader can look at rather than assets nobody opens.
      #
      # Each is fetched on its own and none is fatal. A release published before
      # one of these existed, or a night whose build did not write it, is a site
      # with less to say rather than a deploy that does not happen.
      - name: Publish the feed and what describes it alongside the site
        run: |
          for asset in gtfs.zip feed-meta.json validation.json provenance.json \
            enrichment-report.json; do
            if curl -fsSL --retry 3 --retry-delay 5 \
              "https://github.com/planarnetwork/gb-transit/releases/latest/download/$asset" \
              -o "apps/website/public/.$asset.part"
            then
              mv "apps/website/public/.$asset.part" "apps/website/public/$asset"
            else
              # curl -f can still leave a partial file behind, and a truncated
              # validation.json is worse than an absent one: the page handles
              # absent, and reports what it has rather than what it half has.
              rm -f "apps/website/public/.$asset.part" "apps/website/public/$asset"
              echo "The latest release has no $asset, so the site goes up without it."
            fi
          done
          ls -lh apps/website/public/

      # The site is built by astro rather than by the repository's `tsc -b`, but
      # the page that lists the stations reads their names out of the feed, which
      # is `@gb-transit/gtfs-loader`'s job and wants it compiled.
      - run: yarn build

      # A release carries the patterns as one file because a release takes 1000
      # assets and the network has 2,797 stations. Serving them is the other way
      # round: a planner wants the station somebody is departing from and not the
      # rest of the country, so the file is broken up here rather than rebuilt.
      # Nothing is generated - the scan already ran, this is a read and a write.
      #
      # Not fatal if it is missing. A night whose scan did not finish publishes a
      # feed without patterns, and the site should still go up.
      - name: Publish the transfer patterns, whole and a station at a time
        run: |
          site=apps/website/public
          release=https://github.com/planarnetwork/gb-transit/releases/latest/download

          # --remove-on-error, because -o writes the file before it knows the
          # status: a 404 would otherwise leave an empty one behind for the site
          # to serve as though it were the patterns.
          get() {
            curl -fsSL --retry 3 --retry-delay 5 --remove-on-error "$release/$1" -o "$2"
          }

          # Nothing is derived here any more. The nightly writes both
          # compressions of the whole file and of every station, and archives the
          # stations, so this copies and unpacks: a change to a page used to cost
          # 34 minutes of recompressing patterns nobody had touched.
          if ! get transfer-patterns.br $site/transfer-patterns.br; then
            echo "The latest release has no transfer patterns, so the site goes up without them."
            exit 0
          fi

          # Everything after the brotli is taken if it is there and shrugged at
          # if it is not. A release from before one of these was published is
          # still a release, and the site missing a file is not a reason to
          # publish no site at all: the page asks what is beside it rather than
          # assuming, so it offers what arrived.
          get transfer-patterns.gz $site/transfer-patterns.gz \
            || echo "No gzip of the whole file on this release."

          mkdir -p $site/transfer-patterns

          for extension in gz br; do
            if get "station-patterns-$extension.tar" "$extension.tar"; then
              tar -xf "$extension.tar" -C $site/transfer-patterns
              rm -f "$extension.tar"
            else
              echo "No $extension archive of the stations on this release."
            fi
          done

          du -sh $site/transfer-patterns* || true
          ls $site/transfer-patterns | wc -l

      # The site is its own build now rather than part of the repository's
      # `tsc -b`, and it reads the latest release over the network to report what
      # the feed currently holds. A build that cannot reach it still deploys; it
      # just has less to say.
      - run: yarn workspace @gb-transit/website run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist
      - id: deploy
        uses: actions/deploy-pages@v5
