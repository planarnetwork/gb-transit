name: Release

on:
  push:
    branches: [ master ]
    # A documentation-only commit must not attempt a release.
    paths:
      - 'apps/**'
      - 'libs/**'
      - '.changeset/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/release.yml'

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
      # The upload is done by the npm CLI rather than yarn, because trusted
      # publishing over OIDC is an npm feature.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn vitest run

      # Pending changesets become a "Version Packages" pull request. Merging it
      # is what triggers the publish below, so the version bump and the publish
      # cannot come apart: a failed publish leaves nothing tagged.
      - uses: changesets/action@v1
        with:
          version: yarn changeset version
          publish: yarn release
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
