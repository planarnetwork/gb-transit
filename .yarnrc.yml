yarnPath: .yarn/releases/yarn-4.18.0.cjs

nodeLinker: node-modules

# Build scripts are denied by default; the packages that genuinely need one are
# allowlisted with `dependenciesMeta.<pkg>.built` in the root manifest.
enableScripts: false

# A release is quarantined for a day before it can be installed. These are
# published from planarnetwork alongside this repository, and a change to one of
# them is usually made for this repository and wanted the same day.
npmPreapprovedPackages:
  - transfer-pattern-planner
  - connection-scan-algorithm
  - raptor-journey-planner

# Keep the cache inside the project so CI can restore it as a single directory
# (see .github/workflows/ci.yml).
enableGlobalCache: false
