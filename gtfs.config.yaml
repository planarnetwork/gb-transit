# The nightly build.
#
# A config rather than a command line, so a change to what the published feed
# contains arrives as a diff somebody approved rather than as an edited flag in
# a workflow file.

source:
  - data/feeds

out: feed

enrichers:
  # Where a station actually is. The DTD gives coordinates as OSGB eastings and
  # northings rounded to 100 metres, so unaided the best the feed can do is a
  # point somewhere in the car park; NaPTAN surveys them.
  #
  # Names too, since #149: NaPTAN's CommonName is "Aberdare Rail Station" where
  # the departure boards say "Aberdare", and stripping that suffix leaves 2,454
  # of 2,580 names identical to the ones the override file carries.
  NAPTAN:
    options:
      # NaPTAN is trusted over the hand-maintained override file wherever it
      # has an answer. The file stays as the fallback for a build that runs no
      # enrichers, which is what the library does by default.
      names: true
    apply:
      - stop_lat
      - stop_lon
      - located
      # MSN names are upper case and truncated to sixteen characters, so the
      # feed called Newcastle Airport NEWCASTLE AIRPRT. 168 stations are
      # renamed; docs/station-names.md records where the two sources differ.
      - stop_name

  # Whether a wheelchair user can get to a platform. The DTD says nothing about
  # it, so this has been coming from a hand-maintained table of 2,442 entries
  # that nothing checked and nothing refreshed; the Knowledgebase is the
  # industry's own record of it, audited by the ORR and updated daily.
  #
  # Named for the feed rather than the source: the Knowledgebase publishes
  # several and there will be more of these.
  #
  # Needs a Rail Data Marketplace subscription to the stations feed, whose key
  # is read from KNOWLEDGEBASE_API_KEY. A stale cached copy is used in
  # preference to failing, and only a download needs the key.
  KNOWLEDGEBASE_STATIONS:
    apply:
      # 1 wherever a step-free path to a platform exists - categories A, B1, B2
      # and B3 - and 2 only for C, which is the value that tells a wheelchair
      # user not to travel. A station the Knowledgebase has not classified keeps
      # whatever it already had rather than being set to "no information".
      - wheelchair_boarding
      # The station's page, which has the lifts, the ramps and the opening
      # times this feed has nowhere to put. Empty until now, so this adds
      # rather than replaces.
      - stop_url

extensions:
  # Group stations as GTFS Fares v2 areas: 1072 "London Terminals" is Euston,
  # Waterloo, King's Cross and fifteen others, and a rider holding a ticket to
  # it needs to know which stations that is.
  #
  # Membership comes from the fares refresh, which the workflow downloads
  # alongside the timetable. With no `source` option the package looks beside
  # the timetable feed, which is where it lands.
  - STATION_GROUPS
